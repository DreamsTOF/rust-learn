[workspace]
resolver = "2"
members = [
    "00_setup/*",
    "01_basics/*",
    "02_signals/*",
    "03_components/*",
    "04_events_forms/*",
    "05_async/*",
    "06_router/*",
    "07_context_state/*",
    "08_fullstack/*",
    "09_advanced/*",
    "10_verification/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
dioxus-logger = "0.6"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["wasm"] }
gloo-net = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.2"
futures = "0.3"
gloo-timers = "0.3"

dioxus-fullstack = { version = "0.7", features = ["axum"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
tower-sessions = "0.13"
serde_json = "1"
