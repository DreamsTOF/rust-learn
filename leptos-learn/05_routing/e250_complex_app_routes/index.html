<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>练习 250 - 综合路由架构</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 220px; background: #1a1a2e; color: #eee; padding: 1.5rem; }
        .sidebar a { display: block; color: #a8a8c8; text-decoration: none; padding: 0.5rem 0; }
        .sidebar a:hover, .sidebar a.active { color: #fff; }
        .sidebar h3 { color: #fff; margin-top: 0; }
        .content { flex: 1; padding: 2rem; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
        .auth-page { max-width: 400px; margin: 4rem auto; text-align: center; }
        .auth-page input { display: block; width: 100%; padding: 0.5rem; margin: 0.5rem 0; }
        .btn { padding: 0.5rem 1.5rem; cursor: pointer; border: none; border-radius: 4px; }
        .btn-primary { background: #4361ee; color: #fff; }
        .btn-primary:hover { background: #3a56d4; }
        .btn-outline { background: transparent; border: 1px solid #4361ee; color: #4361ee; }
    </style>
</head>
<body></body>
</html>
