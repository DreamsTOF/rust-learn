[package]
name = "shopos-v2-answer"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
leptos = "0.8.20"
leptos_router = "0.8.13"
leptos_meta = "0.8.6"
leptos_axum = "0.8.6"
leptos-use = "0.19.0"
thaw = { git = "https://github.com/thaw-ui/thaw", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4"
gloo-net = "0.6"
web-sys = "0.3"
send_wrapper = "0.6"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
thiserror = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
tower-sessions = { version = "0.13", optional = true }
axum = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
argon2 = { version = "0.5", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
time = { version = "0.3", optional = true }

[features]
default = ["ssr"]
ssr = [
    "dep:sqlx",
    "dep:chrono",
    "dep:tokio",
    "dep:tower-http",
    "dep:tower-sessions",
    "dep:axum",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:argon2",
    "dep:uuid",
    "dep:time",
]
hydrate = [
    "leptos/hydrate",
]

[[bin]]
name = "shopos-v2-answer-server"
path = "src/main.rs"
required-features = ["ssr"]
