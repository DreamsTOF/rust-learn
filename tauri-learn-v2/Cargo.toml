[workspace]
resolver = "2"
members = [
    "01_first_app/e01_counter/src-tauri",
    "01_first_app/e01_counter_answer/src-tauri",
    "02_mini_apps/a01_todo/src-tauri",
    "02_mini_apps/a01_todo_answer/src-tauri",
    "02_mini_apps/a02_notepad/src-tauri",
    "02_mini_apps/a02_notepad_answer/src-tauri",
    "02_mini_apps/a03_pomodoro/src-tauri",
    "02_mini_apps/a03_pomodoro_answer/src-tauri",
    "02_mini_apps/a04_image_viewer/src-tauri",
    "02_mini_apps/a04_image_viewer_answer/src-tauri",
    "02_mini_apps/a05_expense_tracker/src-tauri",
    "02_mini_apps/a05_expense_tracker_answer/src-tauri",
    "02_mini_apps/a06_exchange_rate/src-tauri",
    "02_mini_apps/a06_exchange_rate_answer/src-tauri",
    "02_mini_apps/a07_batch_rename/src-tauri",
    "02_mini_apps/a07_batch_rename_answer/src-tauri",
    "02_mini_apps/a08_clipboard_history/src-tauri",
    "02_mini_apps/a08_clipboard_history_answer/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tauri = { version = "2.11", features = [] }
tauri-build = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tauri-plugin-fs = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-shell = "2.3"
tauri-plugin-sql = { version = "2.4", features = ["sqlite"] }
tauri-plugin-store = "2.4"
tauri-plugin-notification = "2.3"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-http = "2.5"
tauri-plugin-os = "2.3"
tauri-plugin-opener = "2.5"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-window-state = "2.3"
tauri-plugin-updater = "2.10"
tauri-plugin-single-instance = "2.3"
