<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>练习 E13: 命令模块化</title>
  </head>
  <body>
    <main>
      <h1>练习 E13: 命令模块化</h1>
      <p class="sub">commands/ 目录拆分 → 子模块定义命令 → 跨模块注册</p>
      <div class="card">
        <h2>数学计算（commands::math）</h2>
        <div class="row">
          <input id="a" type="number" placeholder="a" value="10" />
          <input id="b" type="number" placeholder="b" value="4" />
          <button id="add-btn">a + b</button>
          <button id="sub-btn">a - b</button>
        </div>
        <p id="math-result" class="status"></p>
      </div>
      <div class="card">
        <h2>文本处理（commands::text）</h2>
        <div class="field">
          <input id="text" type="text" placeholder="输入一段文本" value="hello tauri world" />
        </div>
        <div class="row">
          <button id="upper-btn">转大写</button>
          <button id="count-btn">统计单词数</button>
        </div>
        <p id="text-result" class="status"></p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
