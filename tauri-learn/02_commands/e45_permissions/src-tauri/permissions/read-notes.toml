# === 步骤 1: 补全 read-notes 权限集 ————————————————————————
# TODO: 补全 permissions 数组（缺读文本文件条目）
# 提示: 'fs:allow-read-text-file',
# 说明: identifier 写在 [[set]] 段里（不是文件名）；
#       permissions 数组只接受 identifier 字符串，scope 收紧在 capabilities 中完成
[[set]]
identifier = 'read-notes'
description = '允许读写笔记目录'
permissions = [
  'fs:allow-write-text-file',
]